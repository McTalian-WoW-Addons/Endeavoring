name: PR Checks

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: {}

jobs:
  pr-checks:
    permissions:
      contents: read
      actions: write
      pull-requests: write
      checks: write
    # trunk-ignore(pinact/unpinned-action)
    uses: McTalian-WoW-Addons/wow-build-tools/.github/workflows/pr-checks.yml@v1
    with:
      addon-name: Endeavoring
      rockspec-name: endeavoring-1-1.rockspec
      lua-version: 5.4.4
      i18n-enabled: true
      trunk-enabled: true
      # Not passing boot-sim-mocks: Endeavoring_spec/_mocks/helper.lua
      # require("busted") transitively (nsMocks.lua), which boot-sim's
      # plain-Lua subprocess doesn't have available. Not needed either --
      # boot-sim's built-in WoW API mocks already give a clean, meaningful
      # result without it (validated locally: 34/34 steps).
      boot-sim-enabled: true
    secrets: inherit
